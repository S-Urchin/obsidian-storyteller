# Builds, attests and publishes a release when a version tag is pushed.
#
#   1. Bump the version in manifest.json, package.json and versions.json, and commit.
#   2. git tag -a 0.6.1 -m "Release notes in Markdown"   (the message becomes the release notes)
#   3. git push origin 0.6.1
#
# Anyone can check a downloaded file came from this repo:
#   gh attestation verify main.js --repo S-Urchin/obsidian-storyteller
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # create the release
  id-token: write # sign the attestation
  attestations: write # store the attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Checkout leaves the tag without its message; fetch it whole so the notes come from it.
      - name: Fetch the tag message
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --verify-tag --notes-from-tag
